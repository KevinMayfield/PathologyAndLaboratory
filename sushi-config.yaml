id: uk.org.examplesihe.palm
canonical: https://examplesihe.org.uk
version: 0.1.0
name: EnglandPaLM
title: England Pathology and Laboratory Medicine (PaLM) Technical Framework
description: DRAFT - not an authoritative source. England localisation of the IHE Pathology and Laboratory Medicine (PaLM) Technical Framework, covering HL7 v2.5.1 and HL7 FHIR R4 and how to map between them. Aligned with the NHS England Pathology and Laboratory Medicine Reporting FHIR API (DAPB4101), HL7 Europe Laboratory Report and the NW GMSA FHIR IG.
releaseLabel: ci-build
status: draft
experimental: true
publisher:
  - name: Kevin Mayfield
  - url: https://github.com/KevinMayfield/PathologyAndLaboratory
license: CC-BY-4.0
fhirVersion: 4.0.1
jurisdiction: urn:iso:std:iso:3166#GB "United Kingdom of Great Britain and Northern Ireland"
copyrightYear: 2026+

dependencies:
  hl7.fhir.eu.base: 2.0.1
  hl7.fhir.eu.laboratory: 2.1.0
  hl7.fhir.eu.extensions.r4: 1.3.1
  # R5 cross-version extensions used by HL7 Europe; required by SUSHI 3.21+
  hl7.fhir.uv.xver-r5.r4: 0.1.0

FSHOnly: false
parameters:
  shownav: true
  apply-contact: 'true'
  apply-jurisdiction: 'true'
  apply-publisher: 'true'
  apply-version: 'true'
  # SNOMED CT UK Edition for expansions/validation (same as the NW GMSA IG)
  path-expansion-params: '../resources/Parameters-exp-params.json'

instanceOptions:
  setMetaProfile: standalone-only

